# =============================================================================
# docker-compose.yml – Proyecto final de Sistemas Operativos (UAO)
# -----------------------------------------------------------------------------
# Describe en un solo archivo todos los contenedores de la infraestructura.
# Se levanta con:   docker compose up -d --build
#
# Servicios: 3 backends + Nginx (tráfico) y nginx-exporter, cAdvisor,
# Prometheus y Grafana (monitoreo).
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # Backends: 3 contenedores construidos con el MISMO Dockerfile (./backend).
  # Solo cambia SERVER_NAME, que es lo que cada uno muestra en su respuesta.
  # No tienen "ports:": no son accesibles desde el host, solo desde la red
  # interna. Así nadie puede saltarse el proxy.
  # ---------------------------------------------------------------------------
  app1:
    build: ./backend
    environment:
      SERVER_NAME: "server 1"
    # Docker consulta /health cada 5 s. Si responde, el contenedor queda
    # "healthy"; Nginx espera a que los 3 lo estén antes de arrancar.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 3s
    networks:
      - red_proyecto

  app2:
    build: ./backend
    environment:
      SERVER_NAME: "server 2"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 3s
    networks:
      - red_proyecto

  app3:
    build: ./backend
    environment:
      SERVER_NAME: "server 3"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 3s
    networks:
      - red_proyecto

  # ---------------------------------------------------------------------------
  # Nginx: proxy inverso y balanceador. Es la ÚNICA puerta de entrada.
  # ---------------------------------------------------------------------------
  nginx:
    # Versión fija (nada de :latest) para que el entorno sea reproducible.
    image: nginx:1.27.5-alpine
    # Publica el puerto 80 del contenedor como 8080 en el host:
    # en el navegador se entra por http://localhost:8080
    ports:
      - "8080:80"
    # Bind mount de solo lectura (:ro) de la CARPETA ./nginx sobre conf.d.
    # Nginx carga todos los *.conf de conf.d, así que lee nuestro nginx.conf
    # (y la configuración por defecto de la imagen queda tapada).
    # Se monta la carpeta y no el archivo suelto porque, en Docker Desktop con
    # WSL2, si un editor reemplaza el archivo al guardarlo, el montaje de un
    # archivo suelto queda apuntando al viejo y Nginx no vuelve a arrancar
    # (error "no such file or directory", visto en la Fase 1).
    volumes:
      - ./nginx:/etc/nginx/conf.d:ro
    # Nginx solo arranca cuando los 3 backends están "healthy". Si arrancara
    # antes, fallaría con "host not found in upstream".
    depends_on:
      app1:
        condition: service_healthy
      app2:
        condition: service_healthy
      app3:
        condition: service_healthy
    networks:
      - red_proyecto

  # ===========================================================================
  # MONITOREO
  # ===========================================================================

  # ---------------------------------------------------------------------------
  # nginx-prometheus-exporter: Nginx no habla el formato de Prometheus, así
  # que este contenedor lee la página /stub_status y la traduce a métricas.
  # ---------------------------------------------------------------------------
  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.5.3
    # Dirección de stub_status. "nginx" es el nombre del servicio de Nginx
    # y 80 su puerto INTERNO (no el 8080 del host).
    command:
      - "--nginx.scrape-uri=http://nginx:80/stub_status"
    # Publicado para poder ver sus métricas desde el navegador:
    # http://localhost:9113/metrics
    ports:
      - "9113:9113"
    depends_on:
      - nginx
    networks:
      - red_proyecto

  # ---------------------------------------------------------------------------
  # cAdvisor (Google): mide CPU, memoria, red y disco de CADA contenedor
  # leyendo los cgroups del kernel. Por eso necesita ver partes del sistema
  # del host (montajes de solo lectura) y permisos elevados.
  # Nota: las versiones nuevas se publican en ghcr.io/google/cadvisor;
  # gcr.io/cadvisor/cadvisor (el de la presentación) dejó de actualizarse.
  # ---------------------------------------------------------------------------
  cadvisor:
    image: ghcr.io/google/cadvisor:v0.60.6
    # Dentro del contenedor escucha en 8080, pero ese puerto del host ya lo
    # usa Nginx; por eso se publica como 8081: http://localhost:8081
    ports:
      - "8081:8080"
    # Permisos elevados: cAdvisor necesita leer información del kernel
    # (cgroups, /dev/kmsg) que un contenedor normal no puede ver.
    privileged: true
    devices:
      - /dev/kmsg
    # -------------------------------------------------------------------------
    # AJUSTE PARA DOCKER DESKTOP + WSL2 (ver docs/fase4-monitoreo.md)
    # En Docker Desktop los contenedores corren en una máquina virtual (VM)
    # propia. Los montajes típicos de cAdvisor ("/:/rootfs", "/var/lib/docker")
    # se resuelven desde Ubuntu (WSL) y NO desde esa VM, así que cAdvisor no
    # encontraba los contenedores (sin nombres, sin red, sin disco).
    # Solución:
    #  1) pid: host -> cAdvisor comparte la tabla de procesos de la VM; así
    #     /proc/1/root es la raíz de archivos REAL de la VM.
    #  2) Al arrancar se crean dos enlaces simbólicos hacia esa raíz:
    #       /rootfs          -> /proc/1/root                 (red y procesos)
    #       /var/lib/docker  -> /proc/1/root/var/lib/docker  (uso de disco)
    #     y luego se ejecuta el arranque normal de la imagen (entrypoint.sh).
    #  3) --containerd apunta al socket de containerd de la VM (nombres).
    # En Linux nativo bastarían los montajes estándar de la documentación.
    # -------------------------------------------------------------------------
    pid: host
    entrypoint:
      - /bin/sh
      - -c
      - >-
        ln -sfn /proc/1/root /rootfs &&
        ln -sfn /proc/1/root/var/lib/docker /var/lib/docker &&
        exec /usr/bin/entrypoint.sh "$@"
      - cadvisor
    # Montajes de solo lectura con lo que cAdvisor necesita observar:
    volumes:
      - /var/run:/var/run:ro                  # socket de Docker: nombres de los contenedores
      - /sys:/sys:ro                          # cgroups: CPU y memoria de cada contenedor
      - /dev/disk/:/dev/disk:ro               # información de discos
    # Argumentos para cAdvisor (llegan a entrypoint.sh como "$@"):
    # --docker_only: mide solo los contenedores de Docker (no cada proceso del host).
    # --housekeeping_interval: cada cuánto recalcula; 5 s, igual que Prometheus.
    # --containerd: socket de containerd DENTRO de la VM. Sin esto cAdvisor no
    #   reconoce los contenedores y solo reporta la serie raíz "/".
    command:
      - "--docker_only=true"
      - "--housekeeping_interval=5s"
      - "--containerd=/proc/1/root/run/containerd/containerd.sock"
    networks:
      - red_proyecto

  # ---------------------------------------------------------------------------
  # Prometheus: visita los /metrics de los backends, del exporter y de
  # cAdvisor, y guarda las series de tiempo.
  # ---------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v3.15.1
    ports:
      - "9090:9090"                           # interfaz web: http://localhost:9090
    volumes:
      # Bind mount de solo lectura de la CARPETA ./prometheus (contiene
      # prometheus.yml). Se monta la carpeta y no el archivo por el mismo
      # problema de Docker Desktop/WSL2 visto con Nginx en la Fase 1.
      - ./prometheus:/etc/prometheus:ro
      # Volumen con nombre: aquí Prometheus guarda sus datos (/prometheus).
      # Sobrevive a "docker compose down"; solo se borra con "down -v".
      - prometheus_data:/prometheus
    depends_on:
      - app1
      - app2
      - app3
      - nginx-exporter
      - cadvisor
    networks:
      - red_proyecto

  # ---------------------------------------------------------------------------
  # Grafana: dibuja los dashboards consultando a Prometheus.
  # Interfaz: http://localhost:3000  (usuario admin / contraseña admin la
  # primera vez; Grafana pide cambiarla).
  # ---------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:13.2.4
    ports:
      - "3000:3000"
    volumes:
      # Volumen con nombre: base de datos de Grafana (usuarios, DASHBOARDS
      # creados en la interfaz...). Sobrevive a "docker compose down";
      # "down -v" lo borraría junto con los dashboards.
      - grafana_data:/var/lib/grafana
      # Bind mount de solo lectura: conexión automática a Prometheus
      # (grafana/provisioning/datasources/prometheus.yml).
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    networks:
      - red_proyecto

# -----------------------------------------------------------------------------
# Volúmenes con nombre: almacenamiento administrado por Docker que sobrevive
# aunque se eliminen los contenedores (persistencia de datos).
# -----------------------------------------------------------------------------
volumes:
  prometheus_data:
  grafana_data:

# -----------------------------------------------------------------------------
# Red Docker personalizada (tipo bridge). Todos los servicios se conectan a
# ella y se encuentran por NOMBRE gracias a su DNS interno (por ejemplo,
# Nginx llega a "app1:5000"). La red bridge por defecto no tiene ese DNS.
# -----------------------------------------------------------------------------
networks:
  red_proyecto:
    driver: bridge
