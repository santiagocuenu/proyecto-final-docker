# =============================================================================
# Configuración de Nginx: proxy inverso + balanceo de carga
# -----------------------------------------------------------------------------
# Este archivo se monta (solo lectura) como /etc/nginx/conf.d/default.conf.
# Nginx lo incluye dentro de su bloque "http", por eso aquí solo van
# log_format, upstream y server.
# =============================================================================

# Formato de registro propio: cada línea dice a QUÉ backend se envió la petición
# ($upstream_addr) y cuánto tardó ($request_time). Es la mejor forma de ver el
# balanceo con "docker compose logs nginx".
log_format lb '$remote_addr -> upstream=$upstream_addr "$request" '
              'status=$status tiempo=$request_time s';

# Grupo (pool) de backends. app1, app2 y app3 son los NOMBRES DE SERVICIO del
# docker-compose.yml: el DNS interno de la red Docker los traduce a la IP de
# cada contenedor. Sin algoritmo declarado, Nginx usa Round Robin (por turnos):
# petición 1 -> app1, 2 -> app2, 3 -> app3, 4 -> app1...
upstream backend_pool {
    # Memoria compartida (64 KB) para el estado del pool.
    # Nginx arranca un proceso "worker" por cada CPU (aquí 12) y, sin esta
    # línea, cada worker lleva SU PROPIO turno del Round Robin: el reparto sale
    # desigual (se midió 11/1/0 en 12 peticiones). Con "zone" todos los workers
    # comparten un único contador y el reparto vuelve a ser 4/4/4.
    zone backend_pool 64k;

    server app1:5000;
    server app2:5000;
    server app3:5000;
}

server {
    # Puerto dentro del contenedor. Compose lo publica como 8080 en el host.
    listen 80;

    # Registros de acceso con el formato "lb" definido arriba, enviados a la
    # salida estándar para que Docker los muestre con "docker compose logs".
    access_log /dev/stdout lb;

    location / {
        # La línea que convierte a Nginx en proxy: reenvía la petición al pool.
        proxy_pass http://backend_pool;

        # Cabeceras para que el backend sepa quién es el cliente real.
        # Sin ellas, el backend solo vería la IP de Nginx.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Tolerancia a fallos: si un backend no acepta la conexión en 2 s o
        # responde 502/503/504, Nginx reintenta la petición con el siguiente.
        proxy_connect_timeout 2s;
        proxy_next_upstream error timeout http_502 http_503 http_504;

        # Cabecera de depuración: IP:puerto del backend que atendió.
        add_header X-Upstream $upstream_addr always;
    }
}
